<style id="ev-bloque2-correccion-gerencial">
/* BLOQUE 2 CORREGIDO
   - Sin franja diagonal de AGOTADO
   - Catálogo más amplio y respirado en computadora
   - Dos columnas reales en escritorio
   - Una columna en celular
   - No altera carrito, precios, cantidades ni tabulación
*/

/* Elimina completamente la cinta roja diagonal */
.producto.ev-agotado::before,
.producto:has(button[disabled])::before {
  content: none !important;
  display: none !important;
}

/* El agotado se comunica solamente en el botón y en Stock */
.producto.ev-agotado,
.producto:has(button[disabled]) {
  opacity: 1 !important;
  border-color: #d9e0e8 !important;
  background: #fbfcfd !important;
}

.producto.ev-agotado .imagen,
.producto:has(button[disabled]) .imagen {
  opacity: .78 !important;
}

.producto button[disabled] {
  background: #737f8c !important;
  color: #fff !important;
  cursor: not-allowed !important;
}

/* Más aire y presencia de página web en computadora */
#evProductosGrid {
  width: min(1280px, calc(100% - 64px)) !important;
  max-width: 1280px !important;
  margin: 30px auto 56px !important;
  padding: 0 !important;
  grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
  column-gap: 34px !important;
  row-gap: 36px !important;
}

#evProductosGrid > .producto {
  padding: 24px !important;
  border-radius: 20px !important;
  box-shadow: 0 10px 28px rgba(19, 47, 78, .09) !important;
}

.producto .imagen {
  height: 235px !important;
  margin: 8px 0 14px !important;
}

.producto .imagen img {
  height: 210px !important;
  max-width: 310px !important;
}

.producto h2 {
  min-height: 2.8em !important;
  font-size: 1.16rem !important;
  margin-bottom: 10px !important;
}

.producto .detalles {
  padding: 14px 0 !important;
}

/* Inicio más limpio, compacto y ordenado */
.hero {
  padding-top: 28px !important;
  padding-bottom: 28px !important;
}

.hero .logo {
  max-height: 125px !important;
}

.hero-title {
  margin-top: 8px !important;
}

.hero-sub {
  margin-bottom: 14px !important;
}

.hero-steps {
  margin-top: 12px !important;
  margin-bottom: 14px !important;
}

.ev-menu {
  max-width: 1216px !important;
  margin-top: 26px !important;
}

/* Pantallas medianas: sigue en dos columnas, pero con mejor separación */
@media (max-width: 1050px) {
  #evProductosGrid {
    width: min(940px, calc(100% - 40px)) !important;
    grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
    gap: 24px !important;
  }

  #evProductosGrid > .producto {
    padding: 20px !important;
  }

  .producto .imagen {
    height: 210px !important;
  }

  .producto .imagen img {
    height: 188px !important;
    max-width: 270px !important;
  }
}

/* Celular: una sola columna, amplia y fácil de usar */
@media (max-width: 700px) {
  #evProductosGrid {
    width: auto !important;
    margin: 18px 12px 38px !important;
    padding: 0 !important;
    grid-template-columns: 1fr !important;
    gap: 20px !important;
  }

  #evProductosGrid > .producto {
    padding: 17px !important;
  }

  .producto .imagen {
    height: 205px !important;
  }

  .producto .imagen img {
    height: 182px !important;
    max-width: 270px !important;
  }

  .hero {
    padding: 20px 12px !important;
  }

  .hero .logo {
    max-height: 105px !important;
  }
}

/* En monitores muy grandes se mantiene en dos columnas para evitar tarjetas apretadas */
@media (min-width: 1500px) {
  #evProductosGrid {
    max-width: 1360px !important;
    width: min(1360px, calc(100% - 96px)) !important;
    gap: 40px !important;
  }
}
</style>

  function isUnavailable(c){
    const t=norm(c.innerText||c.textContent);
    return /AGOTADO|NO DISPONIBLE|SIN STOCK/.test(t)||!!c.querySelector('button[disabled],input[disabled]');
  }
  function findCard(q,exclude){
    const Q=norm(q);
    return cards().find(c=>c!==exclude&&(norm(code(c))===Q||norm(title(c)).includes(Q)||norm(c.innerText).includes(Q))&&!isUnavailable(c));
  }
  function wa(text){window.open('https://wa.me/'+PHONE+'?text='+encodeURIComponent(text),'_blank')}
  function highlight(c){
    if(!c)return;
    c.scrollIntoView({behavior:'smooth',block:'center'});
    c.classList.add('ev-alternativa-destacada');
    setTimeout(()=>c.classList.remove('ev-alternativa-destacada'),2600);
  }
  function addAdvice(card,html){
    let box=card.querySelector('.ev-consejo-comercial');
    if(!box){box=document.createElement('div');box.className='ev-consejo-comercial';card.appendChild(box)}
    box.innerHTML='<strong>💡 Recomendación de Llaves El Veci:</strong> '+html;
  }
  function commercialAdvice(card){
    const t=norm(title(card)+' '+code(card)+' '+card.innerText);
    if(/MAQUINA|COPIADORA|GOSO|GOZO|DEFU|FUBONG/.test(t)) return 'Para iniciar listo para trabajar, revise también el Kit Emprendedor, las llaves adicionales y las argollas. Así la máquina se entrega acompañada del material necesario para comenzar.';
    if(/CONTROL/.test(t)) return 'Conviene revisar también las pilas compatibles para entregar el control completo y listo para usar.';
    if(/CABEZA PLASTICA|COLORES/.test(t)) return 'Las argollas complementan estas llaves y facilitan entregar un producto terminado al cliente.';
    if(/TAG|RFID/.test(t)) return 'Para trabajar con RFID tags, revise también la clonadora compatible disponible en el catálogo.';
    if(/FRESA/.test(t)) return 'Revise el palpador correspondiente para trabajar con la misma medida.';
    if(/VERTICAL/.test(t)) return 'Una máquina vertical se aprovecha mejor junto con adaptadores, fresas y palpadores compatibles.';
    const c=norm(code(card));
    if(PAIRS[c]) return 'También puede revisar '+PAIRS[c]+', porque ambas referencias suelen consultarse juntas y cubren variantes relacionadas.';
    return '';
  }
  function patchStock(card){
    if(card.dataset.evStockFinal==='1')return;
    card.dataset.evStockFinal='1';
    if(!isUnavailable(card))return;
    card.classList.add('ev-sin-stock-final');
    const c=norm(code(card));
    const altInfo=ALT[c];
    const actions=document.createElement('div');actions.className='ev-stock-actions';
    if(altInfo){
      const alt=findCard(altInfo.query,card);
      if(alt){
        const b=document.createElement('button');b.type='button';b.className='ev-ver-alternativa';b.textContent='Ver alternativa disponible';
        b.onclick=()=>highlight(alt);actions.appendChild(b);
        const why=document.createElement('div');why.className='ev-razon-alternativa';why.textContent=altInfo.reason;actions.appendChild(why);
      }
    }
    const q=document.createElement('button');q.type='button';q.className='ev-consultar-stock';q.textContent='Consultar disponibilidad';
    q.onclick=()=>wa('Hola, necesito confirmar disponibilidad de '+title(card)+(code(card)?' (código '+code(card)+')':'')+'.');
    actions.appendChild(q);
    card.appendChild(actions);
  }
  function patchRelated(card){
    if(card.dataset.evRelatedFinal==='1')return;
    card.dataset.evRelatedFinal='1';
    if(isUnavailable(card))return;
    const advice=commercialAdvice(card);
    if(advice)addAdvice(card,advice);
  }
  function cleanWording(){
    const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);
    const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
    nodes.forEach(n=>{
      if(/NFC\s+TAGS?/i.test(n.nodeValue||''))n.nodeValue=n.nodeValue.replace(/NFC\s+TAGS?/gi,'RFID tags');
    });
  }
  function patchAll(){cards().forEach(c=>{patchStock(c);patchRelated(c)});cleanWording()}
  function init(){
    patchAll();
    let timer;
    new MutationObserver(()=>{clearTimeout(timer);timer=setTimeout(patchAll,180)}).observe(document.body,{childList:true,subtree:true});
    document.addEventListener('click',e=>{
      const btn=e.target.closest&&e.target.closest('button');if(!btn)return;
      const card=btn.closest('.producto');if(!card||isUnavailable(card))return;
      const tx=norm(btn.textContent);
      if(/AGREGAR|ANADIR/.test(tx)){
        const advice=commercialAdvice(card);
        if(advice)setTimeout(()=>addAdvice(card,advice),250);
      }
    },true);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(init,2400));
  else setTimeout(init,2400);
})();
</script>

<script id="ev-mejora-total-imagenes-busqueda-global-script">
(function(){
  'use strict';
  const norm=s=>(s||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().trim();
  function codigo(card){
    const nodes=[...card.querySelectorAll('.detalles p,.detalles div,p')];
    for(const n of nodes){
      const t=(n.textContent||'').trim();
      if(/^C[ÓO]DIGO\s*:/i.test(t))return norm(t.split(':').slice(1).join(':'));
    }
    return '';
  }
  function todas(){return [...document.querySelectorAll('.producto')].filter(c=>c.id!=='carritoSeccion')}
  function buscarTarjeta(q){
    q=norm(q); if(!q)return null;
    const cards=todas();
    return cards.find(c=>codigo(c)===q) ||
           cards.find(c=>norm(c.querySelector('h2')?.textContent)===q) ||
           cards.find(c=>codigo(c).startsWith(q)) ||
           cards.find(c=>norm(c.querySelector('h2')?.textContent).includes(q));
  }
  function mostrarDestino(card){
    if(!card)return;
    document.querySelectorAll('.producto.ev-busqueda-destino').forEach(c=>c.classList.remove('ev-busqueda-destino'));
    card.classList.add('ev-busqueda-destino');
    card.style.setProperty('display','block','important');
    let p=card.parentElement;
    while(p&&p!==document.body){
      const cs=getComputedStyle(p);
      if(cs.display==='none')p.style.setProperty('display','block','important');
      p=p.parentElement;
    }
    setTimeout(()=>card.scrollIntoView({behavior:'smooth',block:'center'}),40);
    setTimeout(()=>card.classList.add('ev-alternativa-destacada'),120);
    setTimeout(()=>card.classList.remove('ev-alternativa-destacada'),1900);
  }
  function consultaDesdeBoton(btn){
    const strong=btn.querySelector('strong');
    if(strong)return strong.textContent;
    const txt=(btn.textContent||'').replace(/Disponible|Agotado|Código\s*:/gi,' ').replace(/[·•]/g,' ').trim();
    return txt;
  }
  document.addEventListener('click',function(e){
    const btn=e.target.closest&&e.target.closest('#evSugerenciasBusqueda button,.ev-sugerencia,#sugerencias button');
    if(!btn)return;
    const q=consultaDesdeBoton(btn);
    const card=buscarTarjeta(q) || buscarTarjeta((q.match(/[A-Z]{1,5}\d+[A-Z]*/i)||[])[0]);
    if(card){
      /* Se ejecuta antes de los buscadores anteriores para que el filtro activo no lo oculte */
      mostrarDestino(card);
      setTimeout(()=>mostrarDestino(card),180);
      setTimeout(()=>mostrarDestino(card),500);
    }
  },true);
  const input=document.getElementById('buscador');
  if(input){
    input.addEventListener('keydown',function(e){
      if(e.key!=='Enter')return;
      const card=buscarTarjeta(input.value);
      if(card){e.preventDefault();e.stopImmediatePropagation();mostrarDestino(card)}
    },true);
  }
})();
</script>

  function quitarImprimirPDF(){
    document.querySelectorAll('button,a').forEach(function(el){
      var t=norm(el.textContent);
      if(/IMPRIMIR\s*(\/|Y)?\s*GUARDAR\s*PDF|IMPRIMIR\s*PDF|GUARDAR\s*PDF/.test(t)){
        el.remove();
      }
    });
  }

  function crearModal(){
    if(document.getElementById('evCotizacionAnteriorOverlay'))return document.getElementById('evCotizacionAnteriorOverlay');
    var overlay=document.createElement('div');
    overlay.id='evCotizacionAnteriorOverlay';
    overlay.setAttribute('role','dialog');
    overlay.setAttribute('aria-modal','true');
    overlay.setAttribute('aria-labelledby','evCotizacionAnteriorTitulo');
    overlay.innerHTML=
      '<div id="evCotizacionAnteriorModal">'+
        '<h2 id="evCotizacionAnteriorTitulo">Se encontró una cotización anterior.</h2>'+
        '<p>¿Qué desea hacer?</p>'+
        '<div id="evCotizacionAnteriorAcciones">'+
          '<button type="button" id="evContinuarCotizacion">🟢 Continuar</button>'+
          '<button type="button" id="evNuevaCotizacionGuardada">🔵 Empezar una nueva</button>'+
        '</div>'+
      '</div>';
    document.body.appendChild(overlay);

    overlay.querySelector('#evContinuarCotizacion').addEventListener('click',function(){
      overlay.classList.remove('ev-visible');
    });

    overlay.querySelector('#evNuevaCotizacionGuardada').addEventListener('click',function(){
      try{
        if(typeof window.nuevaCotizacion==='function')window.nuevaCotizacion();
        else{
          localStorage.removeItem('ev_pedido_guardado');
          localStorage.removeItem('numeroCotizacion_actual');
          if(typeof window.carrito!=='undefined'&&Array.isArray(window.carrito))window.carrito.length=0;
          if(typeof window.actualizarListaCarrito==='function')window.actualizarListaCarrito();
          if(typeof window.actualizarResumen==='function')window.actualizarResumen();
        }
        localStorage.setItem('ev_pedido_guardado','[]');
      }catch(e){}
      overlay.classList.remove('ev-visible');
    });
    return overlay;
  }

  function iniciar(){
    quitarImprimirPDF();
    var obs=new MutationObserver(function(){quitarImprimirPDF()});
    obs.observe(document.body,{childList:true,subtree:true});
    if(habiaPedidoAnterior){
      setTimeout(function(){crearModal().classList.add('ev-visible')},900);
    }
  }

  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){setTimeout(iniciar,3200)});
  else setTimeout(iniciar,3200);
})();
</script>

.producto:not(.ev-agotado):not(.ev-agotado-bloqueado):not(.ev-agotado-definitivo):not(.ev-sin-stock-final) button[data-ev-agregar-restaurado="1"]{
  display:block !important;
  visibility:visible !important;
  opacity:1 !important;
  pointer-events:auto !important;
}

<script id="ev-ajuste-carrito-vertical-agregar-script">
(function(){
  'use strict';
  var plantillas=new WeakMap();
  var norm=function(v){return (v||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().trim()};

  function agotado(card){
    if(!card)return true;
    if(card.classList.contains('ev-agotado')||card.classList.contains('ev-agotado-bloqueado')||card.classList.contains('ev-agotado-definitivo')||card.classList.contains('ev-sin-stock-final'))return true;
    var texto=norm(card.innerText||card.textContent);
    return /STOCK\s*:\s*AGOTADO|NO DISPONIBLE|SIN STOCK/.test(texto);
  }

  function botonAgregar(card){
    if(!card)return null;
    return Array.from(card.querySelectorAll('button')).find(function(btn){
      return btn.classList.contains('boton-agregar')||/AGREGAR AL PEDIDO|ANADIR AL PEDIDO|AGREGAR/.test(norm(btn.textContent));
    })||null;
  }

  function guardarPlantillas(){
    document.querySelectorAll('.producto').forEach(function(card){
      if(card.id==='carritoSeccion'||agotado(card)||plantillas.has(card))return;
      var btn=botonAgregar(card);
      if(btn)plantillas.set(card,btn.cloneNode(true));
    });
  }

  function restaurarBoton(card){
    if(!card||card.id==='carritoSeccion'||agotado(card))return;
    var btn=botonAgregar(card);
    if(btn){
      btn.hidden=false;
      btn.disabled=false;
      btn.removeAttribute('aria-hidden');
      btn.style.setProperty('display','block','important');
      btn.style.setProperty('visibility','visible','important');
      btn.style.setProperty('opacity','1','important');
      btn.style.setProperty('pointer-events','auto','important');
      return;
    }
    var plantilla=plantillas.get(card);
    if(!plantilla)return;
    var nuevo=plantilla.cloneNode(true);
    nuevo.dataset.evAgregarRestaurado='1';
    nuevo.hidden=false;
    nuevo.disabled=false;
    nuevo.removeAttribute('aria-hidden');
    nuevo.style.setProperty('display','block','important');
    var input=card.querySelector('input[type="number"],select');
    if(input&&input.parentNode)input.parentNode.insertBefore(nuevo,input.nextSibling);
    else card.appendChild(nuevo);
  }

  function revisarTodo(){
    guardarPlantillas();
    document.querySelectorAll('.producto').forEach(restaurarBoton);
  }

  document.addEventListener('click',function(e){
    var btn=e.target.closest&&e.target.closest('button');
    if(!btn||!/AGREGAR AL PEDIDO|ANADIR AL PEDIDO|AGREGAR/.test(norm(btn.textContent)))return;
    var card=btn.closest('.producto');
    if(!card||agotado(card))return;
    if(!plantillas.has(card))plantillas.set(card,btn.cloneNode(true));
    setTimeout(function(){restaurarBoton(card)},80);
    setTimeout(function(){restaurarBoton(card)},350);
    setTimeout(function(){restaurarBoton(card)},900);
  },true);

  function iniciar(){
    revisarTodo();
    var timer;
    new MutationObserver(function(){
      clearTimeout(timer);
      timer=setTimeout(revisarTodo,90);
    }).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['style','class','hidden','disabled','aria-hidden']});
  }

  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){setTimeout(iniciar,3600)});
  else setTimeout(iniciar,3600);
})();
</script>

<script id="ev-ajuste4-final-uniforme-script">
(function(){
  'use strict';
  function norm(v){
    return (v||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().trim();
  }

  function uniformarInformacion(){
    document.querySelectorAll('.producto').forEach(function(card){
      if(card.id==='carritoSeccion')return;
      var h=card.querySelector('h2');
      var titulo=norm(h&&h.textContent);
      if(/METODOS? DE PAGO/.test(titulo)||/TARJETAS? DE CREDITO/.test(titulo)||/NUESTRA UBICACION|UBICACION|DIRECCION/.test(titulo)){
        card.classList.add('ev-info-final-uniforme');
      }
    });
  }

  function quitarDescripcionDeTabla(tabla){
    if(!tabla || tabla.dataset.evSinDescripcion==='1')return;
    var filas=Array.from(tabla.rows||[]);
    if(!filas.length)return;
    var indice=-1;
    var cabeceras=Array.from(filas[0].cells||[]);
    cabeceras.forEach(function(celda,i){
      if(/DESCRIPCION|PRODUCTO/.test(norm(celda.textContent)) && !/CODIGO/.test(norm(celda.textContent))){
        indice=i;
      }
    });
    if(indice<0){
      var header=tabla.querySelectorAll('thead th');
      Array.from(header).forEach(function(celda,i){
        if(/DESCRIPCION|PRODUCTO/.test(norm(celda.textContent)) && !/CODIGO/.test(norm(celda.textContent))){
          indice=i;
        }
      });
    }
    if(indice<0)return;
    filas.forEach(function(fila){
      if(fila.cells && fila.cells[indice])fila.deleteCell(indice);
    });
    tabla.dataset.evSinDescripcion='1';
  }

  function compactarCotizacion(){
    document.querySelectorAll('.tabla-cotizacion, #resumenCotizacion table, #pedido table').forEach(quitarDescripcionDeTabla);
  }

  function aplicar(){
    uniformarInformacion();
    compactarCotizacion();
  }

  function iniciar(){
    aplicar();
    var timer;
    new MutationObserver(function(){
      clearTimeout(timer);
      timer=setTimeout(aplicar,100);
    }).observe(document.body,{childList:true,subtree:true,characterData:true});
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){setTimeout(iniciar,3900)});
  else setTimeout(iniciar,3900);
})();
</script>


<script id="ev-ajuste5-quitar-columna-repetida">
(function(){
  'use strict';
  function limpiarTabla(tabla){
    if(!tabla) return;
    var encabezado = tabla.querySelector('thead tr:last-child') || tabla.rows[0];
    if(!encabezado) return;
    var titulos = Array.from(encabezado.cells || []).map(function(c){
      return (c.textContent || '').trim().toUpperCase();
    });
    var esCotizacion = titulos.some(function(t){return t.indexOf('CÓDIGO')>=0 || t.indexOf('CODIGO')>=0;}) &&
                       titulos.some(function(t){return t.indexOf('CANT')>=0;}) &&
                       titulos.some(function(t){return t.indexOf('SUBTOTAL')>=0;});
    if(!esCotizacion) return;

    var cantidadColumnas = encabezado.cells.length;
    var filas = tabla.tBodies && tabla.tBodies.length ? Array.from(tabla.tBodies).flatMap(function(tb){return Array.from(tb.rows);}) : Array.from(tabla.rows).slice(1);
    filas.forEach(function(fila){
      while(fila.cells && fila.cells.length > cantidadColumnas){
        /* La segunda celda es la descripción repetida del código. */
        fila.deleteCell(1);
      }
    });
  }

  function aplicar(){
    document.querySelectorAll('.tabla-cotizacion, #resumenCotizacion table, #pedido table').forEach(limpiarTabla);
  }

  var timer;
  function programar(){
    clearTimeout(timer);
    timer=setTimeout(aplicar,60);
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',function(){setTimeout(aplicar,4000);});
  }else{
    setTimeout(aplicar,4000);
  }
  new MutationObserver(programar).observe(document.documentElement,{childList:true,subtree:true});
})();
</script>
